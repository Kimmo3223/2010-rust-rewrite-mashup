[package]
name="skate-host"
version="0.1.0"
edition="2024"
publish=false
[workspace]
[dependencies]
web-time="1.1"
bevy={version="0.19",default-features=false,features=["std","multi_threaded","bevy_log"]}
skate-core={path="../skate-core"}
skate-data={path="../skate-data"}
skate-net={path="../skate-net"}
serde={version="1",features=["derive"]}
serde_json="1"
half="2.7.1"

# The web build's pads: the browser's Gamepad API (`input/platform_web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Gamepad", "GamepadButton"] }
