[package]
name = "skate-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
web-time = "1.1"
flate2 = "=1.1.10"
zstd = "=0.13.3"
skate-core = { path = "../skate-core" }
serde.workspace = true
serde_json.workspace = true

# The web build's file reads (`vfs`): synchronous requests on the page's origin.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
